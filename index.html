<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;700&display=swap" rel="stylesheet">
    </head>
    <body>
        
        <header class="container">
            <img id="logo" src="/images/logo.png">
            <img class="user-avatar" alt="User's profile photo" src="/images/user-avatar.png">
        </header>
        
        <section class="user-post">
            <div class="user-information container">
                <img class="avatar" alt="Vincent van Gogh's profile photo" src="/images/avatar-vangogh.jpg">
                <div class="name-and-location">
                    <h1 class="name">Vincent van Gogh</h1>
                    <p class="location">Zudert, Netherlands</p>
                </div>
            </div>
            <img class="post container" alt="Vincent van Gogh's self portrait" src="/images/post-vangogh.jpg">
            <div class="container">
                <img class="icon" src="/images/icon-heart.png">
                <img class="icon" src="/images/icon-comment.png">
                <img class="icon" src="/images/icon-dm.png">
                <h1 class="likes">21,492 likes</h1>
                <h1 class="username">vincey1853 <span class="comment">just took a few mushrooms lol</span></h1>
            </div>
        </section>

        <script src="index.js"></script>
    </body>
</html>
